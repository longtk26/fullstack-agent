services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    volumes:
      - dbdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 5s
      retries: 10

  app:
    build: .
    environment:
      DB_URL: postgresql://app:app@db:5432/app
      CORS_ORIGINS: "*"
    ports:
      - "8000:8000"
    depends_on:
      db: { condition: service_healthy }

volumes:
  dbdata:
